# ─────────────────────────────────────────────────────────────────────────────
# Production Docker Compose
# - PostgreSQL runs on the HOST (not in Docker) — accessed via host.docker.internal
# - Host Nginx handles SSL termination → reverse proxy to app:8000
# - Storage bind-mounted from host so uploads persist across redeploys
# ─────────────────────────────────────────────────────────────────────────────

x-extra-hosts: &extra-hosts
  extra_hosts:
    - "host.docker.internal:host-gateway"   # reach host PostgreSQL

services:

  # ── Web application (Nginx + PHP-FPM via Supervisor) ──────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${APP_NAME:-TheZoo}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8080}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
    image: wwmcontrol-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"    # host Nginx proxies 443 → localhost:8000
    environment:
      APP_NAME: ${APP_NAME:-TheZoo}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      FRONTEND_URL: ${FRONTEND_URL:-${APP_URL}}
      LOG_CHANNEL: stack
      LOG_LEVEL: ${LOG_LEVEL:-error}
      # Database (host PostgreSQL)
      DB_CONNECTION: pgsql
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # Redis (Docker service)
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: 6379
      # Drivers — use Redis for speed
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      CACHE_STORE: redis
      # Broadcasting (Reverb)
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      # Auth / Sanctum
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
      FILESYSTEM_DISK: local
      # Discord
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      DISCORD_SSL_VERIFY: ${DISCORD_SSL_VERIFY:-true}
    volumes:
      # Bind-mount host storage so uploads persist across redeploys
      - /var/www/wwmcontrol/storage:/var/www/storage
    <<: *extra-hosts
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  # ── Laravel Reverb WebSocket server ───────────────────────────────────────
  reverb:
    image: wwmcontrol-app
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_SERVER_PORT:-8080}:8080"
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: ${APP_ENV:-production}
      DB_CONNECTION: pgsql
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: 6379
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
    <<: *extra-hosts
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  # ── Queue worker ──────────────────────────────────────────────────────────
  queue:
    image: wwmcontrol-app
    restart: unless-stopped
    command: php artisan queue:work redis --tries=3 --timeout=90
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: ${APP_ENV:-production}
      DB_CONNECTION: pgsql
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
    <<: *extra-hosts
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  # ── Task scheduler ────────────────────────────────────────────────────────
  scheduler:
    image: wwmcontrol-app
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: ${APP_ENV:-production}
      DB_CONNECTION: pgsql
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
    <<: *extra-hosts
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  # ── Redis (cache, sessions, queues) ───────────────────────────────────────
  redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  redis-data:
