# ─────────────────────────────────────────────────────────────────────────────
# Nginx host config — thezootopia.online
# SSL terminated here; HTTP traffic proxied to Docker app container (port 8000)
# WebSocket (Reverb) proxied to Docker reverb container (port 8080)
# Static storage files served directly from host filesystem
# ─────────────────────────────────────────────────────────────────────────────

server {
    server_name thezootopia.online;

    # ── Proxy to Docker app container ─────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 20M;
    }

    # ── WebSocket — Reverb (Docker reverb container) ───────────────────────
    location /app {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /apps {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── User-uploaded files — served directly from host ────────────────────
    location /storage/ {
        alias /var/www/wwmcontrol/storage/app/public/;
        try_files $uri $uri/ =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location ~ /\.(?!well-known).* { deny all; }

    # SSL managed by Certbot
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/thezootopia.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thezootopia.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = thezootopia.online) {
        return 301 https://$host$request_uri;
    }
    server_name thezootopia.online;
    listen 80;
    return 404;
}
