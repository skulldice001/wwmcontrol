name: CI/CD Pipeline

on:
  push:
    branches: [ "setup_poker" ]
  pull_request:
    branches: [ "setup_poker" ]

jobs:
  # -----------------------------------------------------------------------------
  # Job 1: Build & Test (Continuous Integration)
  # -----------------------------------------------------------------------------
  build-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, iconv, json, mbstring, pdo
        coverage: none

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate Key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Create SQLite Database
      run: |
        mkdir -p database
        touch database/database.sqlite

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install NPM Dependencies
      run: npm ci

    - name: Build Frontend Assets
      run: npm run build
      env:
        # Mock env vars for build to pass if they are required
        VITE_REVERB_APP_KEY: mock_key
        VITE_REVERB_HOST: localhost
        VITE_REVERB_PORT: 8080
        VITE_REVERB_SCHEME: http

    - name: Ensure Vite Manifest Exists
      run: |
        mkdir -p public/build
        if [ ! -f public/build/manifest.json ]; then
          echo '{}' > public/build/manifest.json
        fi

    - name: Execute Tests (Unit/Feature)
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
      run: php artisan test

  # -----------------------------------------------------------------------------
  # Job 2: Deploy to Server (Continuous Deployment)
  # -----------------------------------------------------------------------------
  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/setup_poker'
    runs-on: ubuntu-latest

    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        port: ${{ secrets.PORT || 22 }}
        script: |
          # Navigate to project directory (Change this path if needed)
          cd /var/www/wwmcontrol

          # Maintenance mode ON
          php artisan down || true

          # Pull latest code
          git fetch origin
          git checkout ${{ github.ref_name }}
          git pull origin ${{ github.ref_name }}

          # Install PHP dependencies
          composer install --no-interaction --prefer-dist --optimize-autoloader

          # Install Node dependencies (Force devDeps for Vite build)
          npm install --production=false

          # Build Assets (CRITICAL: Ensure .env has VITE_ vars set on server!)
          npm run build

          # Run Migrations
          php artisan migrate

          # Clear Caches
          php artisan optimize:clear
          php artisan config:cache
          php artisan event:cache
          php artisan route:cache
          php artisan view:cache

          # Restart Workers & WebSocket
          php artisan queue:restart
          php artisan reverb:restart

          # Maintenance mode OFF
          php artisan up
