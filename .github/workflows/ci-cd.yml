name: CI/CD Pipeline

on:
  push:
    branches: [ "main_source" ]
  pull_request:
    branches: [ "main_source" ]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Test (CI) – không build frontend, server tự build
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, json, pdo
        coverage: none

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate Key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Create SQLite Database
      run: |
        mkdir -p database
        touch database/database.sqlite

    - name: Create fake Vite manifest (for tests that render views)
      run: |
        mkdir -p public/build
        echo '{"resources/css/app.css":{"file":"assets/app.css","src":"resources/css/app.css"},"resources/js/app.js":{"file":"assets/app.js","src":"resources/js/app.js"}}' > public/build/manifest.json

    - name: Execute Tests (Unit/Feature)
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
      run: php artisan test

  # ---------------------------------------------------------------------------
  # Job 2: Deploy to Server (CD) – pull code rồi build trên server
  # ---------------------------------------------------------------------------
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main_source'
    runs-on: ubuntu-latest

    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 2018
        script: |
          set -e
          cd /var/www/wwmcontrol

          # Pull latest code
          git fetch origin
          git checkout main_source
          git pull origin main_source

          # Install PHP dependencies
          composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

          # Build frontend trên server (đọc VITE_* từ .env của server)
          npm install --ignore-scripts
          npm run build

          # Run database migrations
          php artisan migrate --force

          # Clear & rebuild caches
          php artisan optimize:clear
          php artisan config:cache
          php artisan event:cache
          php artisan route:cache
          php artisan view:cache

          # Fix storage permissions
          chown -R www-data:www-data storage bootstrap/cache
          chmod -R 775 storage bootstrap/cache

          # Restart background workers
          php artisan reverb:restart
